{# The message list plus the send box. Posting swaps this whole box so the form resets. #}
<div id="chat-box" class="card p-0">
  <div id="chat-scroll" data-chat-scroll class="h-[60vh] min-h-72 overflow-y-auto p-4" aria-live="polite">
    {% include "chat/_messages.html" %}
  </div>
  <form method="post" action="{% url 'chat:post' event.pk %}" data-chat-form
        hx-post="{% url 'chat:post' event.pk %}" hx-target="#chat-box" hx-swap="outerHTML"
        class="border-t border-line p-4">
    {% csrf_token %}
    <label for="chat-body" class="sr-only">Your message</label>
    <div class="flex items-end gap-3 max-sm:flex-col max-sm:items-stretch">
      <textarea id="chat-body" name="body" rows="2" maxlength="{{ max_length }}" required
                placeholder="Write a message…" class="min-h-12 flex-1 resize-y"
                {% if error %}aria-invalid="true" aria-describedby="chat-error"{% endif %}>{{ body }}</textarea>
      <button class="btn-primary">Send</button>
    </div>
    {% if error %}<p id="chat-error" class="mt-2 font-semibold text-alert" role="alert">{{ error }}</p>{% endif %}
    <p class="help pointer-coarse:hidden">Press Enter to send. Shift + Enter starts a new line.</p>
  </form>
</div>
