# Render Blueprint: one web service and one PostgreSQL database.
# In Render: New > Blueprint, pick this repository. See README "Deploying to Render".
#
# Plans: "free" is fine for trying it out. Before a real event, switch the web
# service to a paid plan (free ones go to sleep after 15 idle minutes and take
# about a minute to wake) and the database to a paid plan (free databases are
# deleted after 30 days).

databases:
  - name: pickleball-db
    plan: free
    region: ohio
    databaseName: pickleball
    user: pickleball

services:
  - type: web
    name: pickleball
    runtime: python
    plan: free
    region: ohio
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pickleball-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Optional. Add your own domain names here, comma separated.
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: ""
      # The first admin. Render asks for these when you create the Blueprint.
      - key: DJANGO_ADMIN_USERNAME
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
