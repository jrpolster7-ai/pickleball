[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = .
norecursedirs = pvenv .venv venv bin staticfiles node_modules .git
addopts = -ra
filterwarnings =
    # staticfiles/ only exists after collectstatic, which tests don't need.
    ignore:No directory at.*staticfiles:UserWarning
