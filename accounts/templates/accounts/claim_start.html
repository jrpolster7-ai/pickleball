{% extends "base.html" %}
{% block title %}Claim your profile · {{ brand_name }}{% endblock %}
{% block content %}
  <div class="page-narrow card">
    <h1>Claim your profile</h1>
    <p class="mt-2">The organizer already added you. Enter the claim code they gave you.</p>
    <form method="get" class="mt-6 space-y-6">
      {% include "includes/form_fields.html" with form=form %}
      <button type="submit" class="btn-primary">Next</button>
    </form>
  </div>
{% endblock %}
