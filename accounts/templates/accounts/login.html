{% extends "base.html" %}
{% block title %}Sign in · {{ brand_name }}{% endblock %}
{% block content %}
  <div class="page-narrow">
    <div class="card">
      <h1>Sign in</h1>
      <form method="post" class="mt-6 space-y-6">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {% include "includes/form_fields.html" with form=form %}
        <button type="submit" class="btn-primary">Sign in</button>
      </form>
    </div>
    <p class="mt-6">New here? <a href="{% url 'accounts:signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}" class="link">Create an account</a></p>
    <p class="mt-2 text-sm">Forgot your password? Ask the organizer to reset it.</p>
  </div>
{% endblock %}
