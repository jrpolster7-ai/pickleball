<section class="card">
  <h2>{{ label }}</h2>
  <p class="help">{{ about }}</p>
  {% if enabled %}
    <div class="mt-3 flex items-center gap-4">
      <img src="{% url 'events:qr_code' event.pk kind %}" alt="QR code for the {{ label|lower }}" class="h-28 w-28 shrink-0" width="112" height="112">
      <p class="code">{{ code }}</p>
    </div>
    <p class="mt-2 break-all text-sm">{{ url }}</p>
  {% else %}
    <p class="mt-3 font-semibold text-alert">Turned off. Nobody can use this code.</p>
  {% endif %}
  <div class="mt-3 flex flex-wrap gap-2">
    <form method="post" action="{% url 'events:code_action' event.pk kind 'rotate' %}" onsubmit="return confirm('Make a new code? The old one stops working.')">
      {% csrf_token %}<button class="btn-secondary btn-small">New code</button>
    </form>
    {% if enabled %}
      <form method="post" action="{% url 'events:code_action' event.pk kind 'disable' %}">{% csrf_token %}<button class="btn-danger btn-small">Turn off</button></form>
    {% else %}
      <form method="post" action="{% url 'events:code_action' event.pk kind 'enable' %}">{% csrf_token %}<button class="btn-primary btn-small">Turn on</button></form>
    {% endif %}
  </div>
</section>
